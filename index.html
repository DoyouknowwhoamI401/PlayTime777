
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayTime</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #050505;
            color: #00ff41;
            font-family: Consolas, monospace;
        }

        h1 {
            color: red;
            text-align: center;
            text-shadow: 0 0 12px red;
            font-size: 30px;
        }

        .subtitle {
            color: #aaa;
            text-align: center;
            font-size: 13px;
        }

        .camera-button {
            display: block;
            margin: 15px auto;
            background: #00ff41;
            color: black;
            border: none;
            padding: 14px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }

            .camera-button:hover {
                background: white;
            }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            max-width: 1200px;
            margin: 25px auto;
        }

        .box {
            background: #101010;
            border: 1px solid #00ff41;
            border-radius: 8px;
            padding: 15px;
            flex: 1 1 300px;
            min-width: 0;
            box-shadow: 0 0 10px #003b10;
        }

        h3 {
            color: #00ff41;
            border-bottom: 1px solid #00ff41;
            padding-bottom: 10px;
        }

        #terminal {
            height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 14px;
            line-height: 1.6;
        }

        .info {
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        #ip {
            font-size: 17px;
            font-weight: bold;
            color: #00ff41;
            text-shadow: 0 0 8px #00ff41;
        }

        video {
            width: 100%;
            min-height: 180px;
            background: black;
            border-radius: 5px;
            object-fit: cover;
        }

        .notice {
            color: #999;
            font-size: 12px;
            line-height: 1.5;
        }

        .status {
            color: #00ff41;
            font-size: 13px;
        }

        @media(max-width: 600px) {
            body {
                padding: 12px;
            }

            h1 {
                font-size: 23px;
            }

            .box {
                flex: 1 1 100%;
            }
        }
    </style>
</head>
<body>
    <h1>YOU'VE BEEN HACKED!</h1>
    <!-- CAMERA BUTTON BELOW HEADING -->
    <button class="camera-button" onclick="openCamera()">
        START CAMERA
    </button>
    <p class="subtitle">
        
    </p>
    <div class="container">
        <div class="box">
            <h3>HACKER TERMINAL</h3>
            <div id="terminal"></div>
        </div>
        <div class="box">
            <h3>NETWORK INFORMATION</h3>
            <div class="info">
                <p id="ip">Demo IP: Initializing...</p>
                <p id="city">Location: Cagayan Valley, Philippines</p>
                <p id="isp">Internet Provider: PLDT</p>
                <p id="connection">Status: Simulation active</p>
            </div>
            <p class="notice">
                
                This an actual visitor IP address.
            </p>
        </div>
        <div class="box">
            <h3>CAMERA PREVIEW</h3>
            <video id="camera" autoplay playsinline muted></video>
            <p id="cameraStatus" class="status">
                Camera is enabled.
            </p>
            <p class="notice">
                Turn On your camera or I will access your Photos
            </p>
        </div>
    </div>
    <script>

// ==============================
// AUTOMATIC TERMINAL TYPING
// ==============================

const terminal = document.getElementById("terminal");

const messages = [
    "> Initializing security simulation...\n",
    "> Loading terminal interface...\n",
    "> Checking demonstration environment...\n",
    "> Scanning fictional network...\n",
    "> Analyzing sample data...\n",
    "> Connecting to demo interface...\n",
    "> Security awareness test running...\n",
    "> No real system has been accessed.\n",
    "> Simulation complete.\n"
];

let messageIndex = 0;
let charIndex = 0;

function typeText() {

    if (messageIndex >= messages.length) {
        terminal.textContent += "\n>FINISHED";
        return;
    }

    const current = messages[messageIndex];

    terminal.textContent += current.charAt(charIndex);
    charIndex++;

    terminal.scrollTop = terminal.scrollHeight;

    if (charIndex >= current.length) {
        charIndex = 0;
        messageIndex++;
        setTimeout(typeText, 200);
    } else {
        setTimeout(typeText, 35);
    }
}

typeText();


// ==============================
// DEMO IP SLOT MACHINE
// SPINS ONCE THEN STOPS
// ==============================

const ipElement = document.getElementById("ip");

function generateDemoIP() {
    return "192.0.2." +
        (Math.floor(Math.random() * 254) + 1);
}

function spinIP() {

    let spins = 0;
    const totalSpins = 30;

    const animation = setInterval(() => {

        ipElement.innerText =
            "IP: " + generateDemoIP();

        spins++;

        if (spins >= totalSpins) {

            clearInterval(animation);

            ipElement.innerText =
                "IP: " + generateDemoIP();
        }

    }, 100);
}

document.getElementById("city").innerText =
    "Location: Cagayan Valley, Philippines";

document.getElementById("isp").innerText =
    "Internet Provider: PLDT";

document.getElementById("connection").innerText =
    "Status: Simulation active";

spinIP();


// ==============================
// CAMERA ACCESS
// REQUIRES VISITOR APPROVAL
// ==============================

async function openCamera() {

    const video = document.getElementById("camera");
    const status = document.getElementById("cameraStatus");

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

        status.innerText =
            "Camera unavailable. HTTPS is required.";

        return;
    }

    try {

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
            });

        video.srcObject = stream;

        status.innerText = "Camera enabled.";

    } catch (error) {

        status.innerText =
            "Camera permission denied or unavailable.";
    }
}

    </script>
</body>
</html>
