
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayTime</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #050505;
            color: #00ff41;
            font-family: Consolas, monospace;
        }

        h1 {
            color: red;
            text-align: center;
            text-shadow: 0 0 12px red;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            max-width: 1200px;
            margin: auto;
        }

        .box {
            background: #101010;
            border: 1px solid #00ff41;
            border-radius: 8px;
            padding: 15px;
            flex: 1 1 300px;
            min-width: 0;
            box-shadow: 0 0 10px #003b10;
        }

        h3 {
            color: #00ff41;
            border-bottom: 1px solid #00ff41;
            padding-bottom: 8px;
        }

        #terminal {
            height: 300px;
            overflow: auto;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 14px;
            line-height: 1.5;
        }

        video {
            width: 100%;
            background: black;
            border-radius: 5px;
            min-height: 180px;
        }

        button {
            background: #00ff41;
            color: black;
            border: none;
            padding: 12px 18px;
            margin-top: 10px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

            button:hover {
                background: white;
            }

        .info {
            overflow-wrap: anywhere;
            line-height: 1.8;
        }

        .notice {
            color: #aaa;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>YOU'VE BEEN HACKED!</h1>
    <p style="text-align:center;color:#aaa;">
        
    </p>
    <div class="container">
        <div class="box">
            <h3>All information</h3>
            <div id="terminal"></div>
        </div>
        <div class="box">
            <h3>PUBLIC IP INFORMATION</h3>
            <div class="info">
                <p id="ip">Loading IP information...</p>
                <p id="city">Location: Loading...</p>
                <p id="isp">Internet provider: Loading...</p>
            </div>
            <p class="notice">
                IP Address have been Compromise
            </p>
        </div>
        <div class="box">
            <h3>CAMERA PREVIEW</h3>
            <video id="camera" autoplay playsinline muted></video>
            <button onclick="openCamera()">Enable Camera</button>
            <p class="notice">
                Enable your Camera or I will post all your photos in social media
            </p>
            <p id="cameraStatus"></p>
        </div>
    </div>
    <script>
// AUTOMATIC TERMINAL TYPING
const terminal = document.getElementById("terminal");

const messages = [
    "Initializing security simulation...\n",
    "Loading terminal interface...\n",
    "Checking demonstration environment...\n",
    "Scanning fictional network...\n",
    "Analyzing sample data...\n",
    "Connecting to demo interface...\n",
    "Security awareness test running...\n",
    "No real system has been accessed.\n",
    "Simulation complete.\n"
];

let messageIndex = 0;
let charIndex = 0;

function typeText() {
    if (messageIndex >= messages.length) {
        terminal.innerHTML += "\n> FINISHED";
        return;
    }

    let current = messages[messageIndex];

    terminal.innerHTML += current.charAt(charIndex);
    charIndex++;

    terminal.scrollTop = terminal.scrollHeight;

    if (charIndex >= current.length) {
        charIndex = 0;
        messageIndex++;
        setTimeout(typeText, 250);
    } else {
        setTimeout(typeText, 45);
    }
}

typeText();


// PUBLIC IP INFORMATION
async function getIPInfo() {
    try {
        const response = await fetch("https://ipapi.co/json/");
        if (!response.ok) throw new Error("Lookup failed");

        const data = await response.json();

        document.getElementById("ip").innerText =
            "IP Address: " + (data.ip || "available");

        document.getElementById("city").innerText =
            "Approximate location: " +
            [data.city, data.region, data.country_name]
            .filter(Boolean).join(", ");

        document.getElementById("isp").innerText =
            "Internet provider: " + (data.org || "available");

    } catch (error) {
        document.getElementById("ip").innerText =
            "IP information available.";

        document.getElementById("city").innerText =
            "Location: available";

        document.getElementById("isp").innerText =
            "Internet provider: available";
    }
}

getIPInfo();


// CAMERA — USER CONSENT REQUIRED
async function openCamera() {
    const video = document.getElementById("camera");
    const status = document.getElementById("cameraStatus");

    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        video.srcObject = stream;
        status.innerText = "Camera enabled.";
    } catch (error) {
        status.innerText =
            "Camera permission denied or camera unavailable.";
    }
}
    </script>
</body>
</html>
